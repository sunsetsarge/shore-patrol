<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Beachhead</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: dark;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #05070a;
    color: #ddd;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
    box-sizing: border-box;
    gap: 10px;
  }
  #canvas-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
  }
  #game-canvas {
    background: #000;
    image-rendering: pixelated;
    box-shadow: 0 0 40px rgba(255, 140, 0, 0.08), 0 0 0 2px #222;
    cursor: crosshair;
  }
  #hints {
    flex: 0 0 auto;
    font-size: 13px;
    color: #8a8f9a;
    text-align: center;
    letter-spacing: 0.3px;
    padding-bottom: 10px;
  }
  #hints b {
    color: #ffd24a;
  }
  #title-bar {
    flex: 0 0 auto;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 4px;
    color: #ff6a3a;
    text-shadow: 0 0 12px rgba(255, 106, 58, 0.5);
    padding-top: 8px;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="title-bar">BEACHHEAD</div>
  <div id="canvas-wrap">
    <canvas id="game-canvas" width="1280" height="720"></canvas>
  </div>
  <div id="hints">
    <b>Mouse</b> aim &middot; <b>LMB</b> fire (hold for auto weapons) &middot;
    <b>1-4</b> select weapon &middot; <b>Q/E</b> or <b>wheel</b> cycle weapons &middot;
    <b>Click / Enter</b> start &amp; restart
  </div>
</div>
<script type="module" src="/src/main.js"></script>
<script>
  // Letterbox scale-to-fit: keep the 1280x720 canvas's aspect ratio while
  // filling available space, without altering its internal resolution.
  function resizeCanvas() {
    const canvas = document.getElementById('game-canvas');
    const wrap = document.getElementById('canvas-wrap');
    const titleH = document.getElementById('title-bar').offsetHeight;
    const hintsH = document.getElementById('hints').offsetHeight;
    const availW = window.innerWidth - 20;
    const availH = window.innerHeight - titleH - hintsH - 40;
    const aspect = 1280 / 720;
    let w = availW;
    let h = w / aspect;
    if (h > availH) {
      h = availH;
      w = h * aspect;
    }
    canvas.style.width = Math.max(320, w) + 'px';
    canvas.style.height = Math.max(180, h) + 'px';
  }
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('DOMContentLoaded', resizeCanvas);
  resizeCanvas();
</script>
</body>
</html>
