<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shore Patrol</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0a0e12; color: #ddd;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  /* Full-bleed stage: the canvas fills the viewport (16:9 letterboxed with a
     soft dark bar). All title/controls/HUD are drawn inside the canvas, so the
     game gets the whole window — no external DOM chrome stealing height. */
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #0a0e12;
  }
  #game-canvas {
    /* scaled to fit by JS; high-quality scaling for the 3D-rendered sprites */
    image-rendering: auto;
    background: #05070a;
    box-shadow: 0 0 60px rgba(255, 140, 0, 0.06);
    cursor: crosshair;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game-canvas" width="1280" height="720"></canvas>
</div>
<script type="module" src="/src/main.js"></script>
<script>
  // Scale the 1280x720 canvas to fill the viewport while preserving 16:9,
  // without touching its internal resolution (the projection math assumes 1280x720).
  function resizeCanvas() {
    const canvas = document.getElementById('game-canvas');
    const aspect = 1280 / 720;
    const availW = window.innerWidth;
    const availH = window.innerHeight;
    let w = availW, h = w / aspect;
    if (h > availH) { h = availH; w = h * aspect; }
    canvas.style.width = Math.round(w) + 'px';
    canvas.style.height = Math.round(h) + 'px';
  }
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('DOMContentLoaded', resizeCanvas);
  resizeCanvas();

  // Fullscreen toggle on F — works in every game state, own listener so it
  // never conflicts with the module's input handling.
  window.addEventListener('keydown', (e) => {
    if (e.key === 'f' || e.key === 'F') {
      const stage = document.getElementById('stage');
      if (!document.fullscreenElement) {
        (stage.requestFullscreen ? stage.requestFullscreen() : Promise.resolve()).catch(() => {});
      } else {
        document.exitFullscreen && document.exitFullscreen();
      }
    }
  });
  document.addEventListener('fullscreenchange', resizeCanvas);
</script>
</body>
</html>
