<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shore Patrol</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0a0e12; color: #ddd;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  /* Full-bleed stage: the canvas fills the viewport (16:9 letterboxed with a
     soft dark bar). All title/controls/HUD are drawn inside the canvas, so the
     game gets the whole window — no external DOM chrome stealing height. */
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #0a0e12;
  }
  #game-canvas {
    /* scaled to fit by JS; high-quality scaling for the 3D-rendered sprites */
    image-rendering: auto;
    background: #05070a;
    box-shadow: 0 0 60px rgba(255, 140, 0, 0.06);
    cursor: crosshair;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game-canvas" width="1280" height="720"></canvas>
</div>
<script type="module" src="/src/main.js"></script>

<!-- SunsetSarge easter egg — click to toggle debug mode -->
<span id="ssEgg" style="position:fixed;bottom:12px;right:14px;
  color:rgba(255,255,255,0.3);font-size:11px;font-family:monospace;
  cursor:pointer;user-select:none;transition:color 0.3s,text-shadow 0.3s;z-index:100;">
  SunsetSarge
</span>

<!-- Debug panel — visible only when debug mode active and game is playing -->
<div id="debugPanel" style="display:none;position:fixed;top:8px;left:8px;
  background:rgba(0,0,0,0.85);border:1px solid #555;border-radius:6px;
  padding:10px 14px;z-index:9999;color:#eee;font-family:monospace;font-size:12px;
  min-width:200px;">
  <div style="color:#ffd700;font-weight:bold;margin-bottom:8px;">🐛 Debug Mode</div>
  <div style="display:flex;flex-direction:column;gap:5px;">
    <button class="dbg-btn" id="dbg-spawn-infantry">👥 Spawn Infantry Wave</button>
    <button class="dbg-btn" id="dbg-spawn-tank">🚗 Spawn Tank</button>
    <button class="dbg-btn" id="dbg-spawn-heli">🚁 Spawn Helicopter</button>
    <button class="dbg-btn" id="dbg-spawn-boat">⛵ Spawn Landing Craft</button>
    <button class="dbg-btn" id="dbg-ammo">📦 Spawn Ammo Crate</button>
    <button class="dbg-btn" id="dbg-next-round">⏭ Next Round</button>
    <button class="dbg-btn" id="dbg-god-mode">🛡 God Mode: OFF</button>
    <button class="dbg-btn" id="dbg-kill-all">💀 Kill All Enemies</button>
  </div>
</div>
<style>
.dbg-btn{background:#222;border:1px solid #555;border-radius:3px;
  color:#eee;font-family:monospace;font-size:11px;
  padding:4px 8px;cursor:pointer;text-align:left;}
.dbg-btn:hover{background:#333;border-color:#888;}
</style>

<script>
  // Scale the canvas to fill the viewport while preserving 16:9. All game code
  // keeps drawing in logical 1280x720 coordinates (the projection math assumes
  // 1280x720); only the pixel backing store below changes.
  // ---- High-DPI backing store (ADR-008) ----
  // The canvas is CSS-stretched to fill the viewport, so a fixed 1280x720
  // backing store throws away detail from the 243-698px source sprites on any
  // display wider than 1280. The backing store is instead sized to
  // 1280*s x 720*s where s = min(devicePixelRatio * cssStretch, 2) -- i.e. the
  // real device pixels the canvas actually occupies, capped at 2x. On an
  // unstretched 1:1 display this reduces to devicePixelRatio.
  // src/main.js applies a matching setTransform, so every draw call keeps using
  // logical 1280x720 coordinates and no drawing coordinate changes anywhere.
  // canvas.width/height are shimmed to report the LOGICAL size so consumers
  // that read them for input/layout math (src/engine/input.js:26,
  // src/systems/upgradeSystem.js:231) keep working unchanged; the native
  // setters are captured first so the backing store can still be resized.
  const LOGICAL_W = 1280, LOGICAL_H = 720;
  const nativeWidthSet = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'width').set;
  const nativeHeightSet = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'height').set;
  (function shimLogicalSize() {
    const canvas = document.getElementById('game-canvas');
    Object.defineProperty(canvas, 'width', { get: () => LOGICAL_W, configurable: true });
    Object.defineProperty(canvas, 'height', { get: () => LOGICAL_H, configurable: true });
  })();

  function updateBackingStore(canvas, cssW) {
    const stretch = cssW / LOGICAL_W;
    const scale = Math.min((window.devicePixelRatio || 1) * stretch, 2);
    const bw = Math.round(LOGICAL_W * scale);
    if (canvas.__backingW === bw) return;
    canvas.__backingW = bw;
    window.__DPR__ = scale;
    nativeWidthSet.call(canvas, bw);
    nativeHeightSet.call(canvas, Math.round(LOGICAL_H * scale));
  }

  function resizeCanvas() {
    const canvas = document.getElementById('game-canvas');
    const aspect = 1280 / 720;
    const availW = window.innerWidth;
    const availH = window.innerHeight;
    let w = availW, h = w / aspect;
    if (h > availH) { h = availH; w = h * aspect; }
    canvas.style.width = Math.round(w) + 'px';
    canvas.style.height = Math.round(h) + 'px';
    updateBackingStore(canvas, w);
  }
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('DOMContentLoaded', resizeCanvas);
  resizeCanvas();

  // ---- Verification harness: window.saveShot(name) ----
  // Captures the CURRENT canvas backing store as a PNG and POSTs it to the
  // screenshot sink (screenshot_sink.py on :8200), which writes shots/<name>.png.
  // Reads canvas.width/height dynamically so it keeps working if the backing
  // store resolution changes. Returns a Promise that resolves when the POST
  // completes; never throws — it logs one line and resolves false on failure.
  window.saveShot = function saveShot(name) {
    const shotName = String(name || 'shot');
    return new Promise((resolve) => {
      const canvas = document.getElementById('game-canvas');
      if (!canvas || !canvas.width || !canvas.height) {
        console.warn('[saveShot] no #game-canvas backing store; skipped ' + shotName);
        resolve(false);
        return;
      }
      canvas.toBlob((blob) => {
        if (!blob) {
          console.warn('[saveShot] canvas.toBlob returned null for ' + shotName);
          resolve(false);
          return;
        }
        fetch('http://localhost:8200/?name=' + encodeURIComponent(shotName), {
          method: 'POST',
          body: blob,
          headers: { 'Content-Type': 'image/png' }
        }).then((res) => {
          if (!res.ok) {
            console.warn('[saveShot] sink returned HTTP ' + res.status + ' for ' + shotName);
            resolve(false);
          } else {
            resolve(true);
          }
        }).catch((err) => {
          console.warn('[saveShot] POST to :8200 failed for ' + shotName + ': ' + err.message);
          resolve(false);
        });
      }, 'image/png');
    });
  };

  // Fullscreen toggle on F — works in every game state, own listener so it
  // never conflicts with the module's input handling.
  window.addEventListener('keydown', (e) => {
    if (e.key === 'f' || e.key === 'F') {
      const stage = document.getElementById('stage');
      if (!document.fullscreenElement) {
        (stage.requestFullscreen ? stage.requestFullscreen() : Promise.resolve()).catch(() => {});
      } else {
        document.exitFullscreen && document.exitFullscreen();
      }
    }
  });
  document.addEventListener('fullscreenchange', resizeCanvas);

  // ---- SunsetSarge easter egg + debug panel ----
  let debugMode = false;

  document.getElementById('ssEgg').addEventListener('click', () => {
    debugMode = !debugMode;
    const el = document.getElementById('ssEgg');
    if (debugMode) {
      el.style.color = 'rgba(255,210,0,0.95)';
      el.style.textShadow = '0 0 8px rgba(255,180,0,0.8)';
    } else {
      el.style.color = 'rgba(255,255,255,0.3)';
      el.style.textShadow = 'none';
      // reset god mode when debug turned off
      if (window.game) window.game.godMode = false;
      document.getElementById('dbg-god-mode').textContent = '🛡 God Mode: OFF';
    }
  });

  // Poll game state to show/hide debug panel
  (function pollDebugPanel() {
    const panel = document.getElementById('debugPanel');
    const g = window.game;
    panel.style.display = (debugMode && g && g.state === 'playing') ? 'block' : 'none';
    requestAnimationFrame(pollDebugPanel);
  })();

  function safeDebug(fn) {
    const g = window.game;
    if (g && g.debug) fn(g.debug);
  }

  document.getElementById('dbg-spawn-infantry').addEventListener('click',
    () => safeDebug(d => d.spawnInfantry()));
  document.getElementById('dbg-spawn-tank').addEventListener('click',
    () => safeDebug(d => d.spawnTank()));
  document.getElementById('dbg-spawn-heli').addEventListener('click',
    () => safeDebug(d => d.spawnHeli()));
  document.getElementById('dbg-spawn-boat').addEventListener('click',
    () => safeDebug(d => d.spawnBoat()));
  document.getElementById('dbg-ammo').addEventListener('click',
    () => safeDebug(d => d.spawnAmmo()));
  document.getElementById('dbg-next-round').addEventListener('click',
    () => safeDebug(d => d.nextRound()));
  document.getElementById('dbg-kill-all').addEventListener('click',
    () => safeDebug(d => d.killAll()));
  document.getElementById('dbg-god-mode').addEventListener('click', () => {
    safeDebug(d => {
      const on = d.toggleGodMode();
      document.getElementById('dbg-god-mode').textContent =
        `🛡 God Mode: ${on ? 'ON' : 'OFF'}`;
    });
  });
</script>
</body>
</html>
